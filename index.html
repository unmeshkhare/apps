<!doctype html>
<html lang="en" data-theme="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graviton Apps</title>
<meta name="description" content="Free tools and simulations for students and curious minds.">
<meta name="theme-color" content="#0b0d26">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311143a'/%3E%3Cpath d='M5 22C11 22 12 8 16 8s5 14 11 14' fill='none' stroke='%239a86ff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='8' r='2.6' fill='%2358e0cf'/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/instrument-serif-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/instrument-serif-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:400;font-display:swap;src:url(fonts/hanken-grotesk-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:500;font-display:swap;src:url(fonts/hanken-grotesk-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:600;font-display:swap;src:url(fonts/hanken-grotesk-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
:root{
  color-scheme: dark;
  --ink-0:#0b0d26;--ink-1:#11143a;--ink-2:#1a1f50;--ink-3:#252b69;
  --line:rgba(150,160,255,.16);--line-strong:rgba(165,175,255,.36);
  --fg:#eceeff;--fg-muted:#a6acde;
  --violet:#9a86ff;--violet-soft:rgba(154,134,255,.18);
  --teal:#58e0cf;--teal-soft:rgba(88,224,207,.16);
  --gold:#f0cb85;--good:#5ee0b0;--bad:#ff8f9c;--bad-soft:rgba(255,143,156,.14);
  --sclera:#eef0ff;--on-accent:#0b0d26;
  --glow1:rgba(120,100,255,.24);--glow2:rgba(60,200,210,.10);
  --card-a:rgba(30,36,88,.55);--card-b:rgba(17,20,58,.78);
  --font-display:'Instrument Serif','Times New Roman',serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-math:'STIX Two Text','Times New Roman',serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
:root[data-theme="aurora"]{--ink-0:#06181d;--ink-1:#0b2830;--ink-2:#123843;--ink-3:#1a4b59;--line:rgba(130,230,210,.16);--line-strong:rgba(140,235,215,.36);--violet:#6fe3b4;--violet-soft:rgba(111,227,180,.17);--teal:#74b9ff;--teal-soft:rgba(116,185,255,.16);--glow1:rgba(60,220,170,.22);--glow2:rgba(80,150,255,.12);--card-a:rgba(18,64,74,.55);--card-b:rgba(9,38,46,.78);--fg-muted:#9fd0cc}
:root[data-theme="dusk"]{--ink-0:#1a0c24;--ink-1:#26123a;--ink-2:#351a4f;--ink-3:#48236b;--line:rgba(230,160,240,.16);--line-strong:rgba(235,170,245,.36);--violet:#e58bdc;--violet-soft:rgba(229,139,220,.17);--teal:#ffb98e;--teal-soft:rgba(255,185,142,.16);--gold:#ffd9a3;--glow1:rgba(220,110,210,.22);--glow2:rgba(255,160,120,.10);--card-a:rgba(66,32,92,.55);--card-b:rgba(38,18,58,.78);--fg-muted:#d0a9d8}
:root[data-theme="ember"]{--ink-0:#190e0b;--ink-1:#26150f;--ink-2:#371e15;--ink-3:#4d2b1d;--line:rgba(255,190,150,.16);--line-strong:rgba(255,200,160,.34);--violet:#ff9a62;--violet-soft:rgba(255,154,98,.17);--teal:#ffd27a;--teal-soft:rgba(255,210,122,.15);--gold:#ffe3a8;--glow1:rgba(255,130,70,.20);--glow2:rgba(255,200,100,.08);--card-a:rgba(80,44,28,.55);--card-b:rgba(44,24,16,.78);--fg-muted:#d6b39f}
:root[data-theme="forest"]{--ink-0:#07150e;--ink-1:#0d2218;--ink-2:#143323;--ink-3:#1d4631;--line:rgba(150,230,170,.15);--line-strong:rgba(160,235,180,.33);--violet:#8fd694;--violet-soft:rgba(143,214,148,.16);--teal:#5fd3c0;--teal-soft:rgba(95,211,192,.15);--glow1:rgba(80,200,120,.18);--glow2:rgba(60,200,180,.09);--card-a:rgba(24,68,44,.55);--card-b:rgba(12,38,26,.78);--fg-muted:#a3cdb0}
:root[data-theme="graphite"]{--ink-0:#0e0f12;--ink-1:#16181c;--ink-2:#21242a;--ink-3:#2d3139;--line:rgba(200,205,220,.14);--line-strong:rgba(210,215,230,.30);--violet:#b9c0d6;--violet-soft:rgba(185,192,214,.16);--teal:#8ee0d0;--teal-soft:rgba(142,224,208,.14);--glow1:rgba(150,160,190,.14);--glow2:rgba(120,200,190,.06);--card-a:rgba(46,50,60,.6);--card-b:rgba(24,26,32,.8);--fg-muted:#aeb4c4}
:root[data-theme="rose"]{--ink-0:#1c0c15;--ink-1:#2a1220;--ink-2:#3b1a2e;--ink-3:#52243f;--line:rgba(255,170,200,.16);--line-strong:rgba(255,180,205,.34);--violet:#ff8fb1;--violet-soft:rgba(255,143,177,.16);--teal:#ffc9a8;--teal-soft:rgba(255,201,168,.15);--gold:#ffdfb0;--glow1:rgba(255,110,160,.20);--glow2:rgba(255,190,150,.08);--card-a:rgba(86,36,62,.55);--card-b:rgba(46,18,34,.78);--fg-muted:#dbaebd}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--ink-0);background-image:radial-gradient(1100px 620px at 82% -12%,var(--glow1),transparent 62%),radial-gradient(900px 520px at -6% 24%,var(--glow2),transparent 60%);background-repeat:no-repeat;background-attachment:fixed;color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
.lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-muted)}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 20px}
.foot{margin-top:auto;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--fg-muted);border-top:1px solid var(--line);padding:18px 20px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--violet-soft);color:var(--fg);border-radius:999px;padding:8px 16px;font:500 13px var(--font-body);text-decoration:none;cursor:pointer;transition:border-color .2s,background .2s}
.pill:hover{border-color:var(--violet);background:var(--teal-soft)}
.pill:focus-visible,.card:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

header.wrap{padding:56px 20px 8px;text-align:center}
.mark{width:44px;height:44px;margin:0 auto 14px;display:block}
h1{font:400 clamp(38px,7vw,60px)/1.05 var(--font-display);margin:0;letter-spacing:-.01em}
.tag{color:var(--fg-muted);font-size:16px;margin:12px auto 0;max-width:520px}
.tag:empty{display:none}
.hbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.hbtns:empty{display:none}
.search{position:relative;max-width:520px;margin:30px auto 8px}
.search input{width:100%;background:linear-gradient(160deg,var(--card-a),var(--card-b));border:1px solid var(--line);border-radius:999px;color:var(--fg);font:400 15px var(--font-body);padding:13px 20px;transition:border-color .2s}
.search input::placeholder{color:var(--fg-muted)}
.search input:hover,.search input:focus{border-color:var(--line-strong)}
.themes{display:flex;gap:9px;justify-content:center;margin:18px 0 0}
.themes button{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong);padding:0;cursor:pointer;background:var(--c);transition:transform .2s}
.themes button:hover{transform:scale(1.18)}
.themes button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink-0),0 0 0 3.5px var(--fg-muted)}
main.wrap{padding:20px 20px 56px;flex:0 0 auto}
.cat{margin-top:34px;--acc:var(--violet);--acc-soft:var(--violet-soft)}
.cat[data-accent=teal]{--acc:var(--teal);--acc-soft:var(--teal-soft)}
.cat[data-accent=gold]{--acc:var(--gold);--acc-soft:rgba(240,203,133,.14)}
.cat[data-accent=rose]{--acc:#ff8fb1;--acc-soft:rgba(255,143,177,.15)}
.cat[data-accent=green]{--acc:var(--good);--acc-soft:rgba(94,224,176,.14)}
.chead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;text-align:left;padding:0 0 12px;cursor:pointer;font:inherit}
.chead .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);flex:none}
.chead .name{font:400 28px/1.1 var(--font-display)}
.chead .sub{color:var(--fg-muted);font-size:13.5px;flex:1;min-width:0}
.chead .count{font:400 10.5px var(--font-mono);letter-spacing:.14em;color:var(--fg-muted);flex:none}
.chead .chev{flex:none;width:9px;height:9px;border-right:1.5px solid var(--fg-muted);border-bottom:1.5px solid var(--fg-muted);transform:rotate(45deg);transition:transform .25s;margin:0 4px 3px}
.cat.closed .chev{transform:rotate(-45deg);margin-bottom:0}
.cat.closed .grid,.cat.closed .empty{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:18px}
.card{position:relative;display:flex;gap:16px;align-items:flex-start;text-decoration:none;padding:18px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card-a),var(--card-b));transition:border-color .25s,box-shadow .25s,transform .25s}
.card:hover{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc-soft),0 10px 34px -12px var(--acc);transform:translateY(-2px)}
.ico{flex:none;width:56px;height:56px;border-radius:15px;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line);background:var(--ink-2)}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.ico span{font:400 28px var(--font-display);color:var(--on-accent)}
.ctext{min-width:0;flex:1}
.cname{font:600 16.5px/1.25 var(--font-body);margin:2px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cdesc{color:var(--fg-muted);font-size:14px;line-height:1.5;margin:0}
.new{font:500 9.5px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-accent);background:var(--teal);border-radius:999px;padding:2px 8px}
.empty,.msg{color:var(--fg-muted);font-size:14px;font-style:italic;margin:18px 0 0}
.msg{text-align:center;margin-top:40px}
@media (max-width:560px){header.wrap{padding-top:40px}.chead .sub{display:none}.chead{justify-content:flex-start}.chead .name{flex:1}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="wrap rise">
  <svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="12" fill="var(--ink-2)" stroke="var(--line-strong)"/><path d="M7 31C16 31 17 12 22 12s6 19 15 19" fill="none" stroke="var(--violet)" stroke-width="2.2" stroke-linecap="round"/><path d="M6 31h32" stroke="var(--fg-muted)" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/><circle cx="22" cy="12" r="3.4" fill="var(--teal)"/></svg>
  <h1 id="siteName">Graviton Apps</h1>
  <p class="tag" id="siteTag"></p>
  <div class="hbtns" id="hbtns"></div>
  <div class="search"><input id="q" type="search" placeholder="Search all apps" aria-label="Search all apps" autocomplete="off"></div>
  <div class="themes" id="themes" role="group" aria-label="Colour theme"></div>
</header>
<main class="wrap" id="main" aria-live="polite"><p class="msg">Loading…</p></main>
<footer class="foot">Made by Unmesh Khare · Graviton Multimedia</footer>
<script>
(function(){
'use strict';
var THEMES={indigo:'#9a86ff',aurora:'#6fe3b4',dusk:'#e58bdc',ember:'#ff9a62',forest:'#8fd694',graphite:'#b9c0d6',rose:'#ff8fb1'};
var TK='graviton.apps.theme',CK='graviton.apps.collapsed';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function setTheme(t){if(!THEMES[t])t='indigo';document.documentElement.setAttribute('data-theme',t);
  var m=document.querySelector('meta[name=theme-color]');
  [].forEach.call(document.querySelectorAll('#themes button'),function(b){b.setAttribute('aria-pressed',b.dataset.t===t)});}
var tb=document.getElementById('themes');
Object.keys(THEMES).forEach(function(t){var b=document.createElement('button');b.type='button';b.dataset.t=t;b.title=t;b.setAttribute('aria-label',t+' theme');b.style.setProperty('--c',THEMES[t]);
  b.addEventListener('click',function(){setTheme(t);lsSet(TK,t)});tb.appendChild(b)});
setTheme(lsGet(TK)||'indigo');

var collapsed={};try{collapsed=JSON.parse(lsGet(CK)||'{}')||{}}catch(e){}
var DATA=null,main=document.getElementById('main'),q=document.getElementById('q');
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:null}
var TILE=['#9a86ff','#58e0cf','#f0cb85','#ff8fb1','#8fd694','#74b9ff','#ffb98e'];
function tileColor(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return TILE[h%TILE.length]}
function icon(a){
  var d=el('div','ico');
  function fallback(){d.textContent='';d.style.background=tileColor(a.name||'?');d.appendChild(el('span',null,(a.name||'?').trim().charAt(0).toUpperCase()))}
  if(a.icon){var i=new Image();i.alt='';i.decoding='async';i.loading='lazy';i.onerror=fallback;i.src=a.icon;d.appendChild(i)}else fallback();
  return d}
function card(a){
  var l=el('a','card');l.href=a.path||'#';
  l.appendChild(icon(a));
  var t=el('div','ctext'),n=el('div','cname');n.appendChild(el('span',null,a.name||''));
  if(a.new)n.appendChild(el('span','new','New'));
  t.appendChild(n);t.appendChild(el('p','cdesc',a.description||''));l.appendChild(t);return l}
function render(){
  var term=q.value.trim().toLowerCase(),found=0;main.textContent='';
  (DATA.categories||[]).forEach(function(c){
    var apps=(c.apps||[]).filter(function(a){return !term||((a.name||'')+' '+(a.description||'')).toLowerCase().indexOf(term)>-1});
    if(term&&!apps.length)return;
    found+=apps.length;
    var s=el('section','cat rise');s.dataset.accent=c.accent||'violet';
    var open=term||!collapsed[c.id];if(!open)s.classList.add('closed');
    var h=el('button','chead');h.type='button';h.setAttribute('aria-expanded',!!open);
    h.appendChild(el('span','dot'));h.appendChild(el('span','name',c.name||''));h.appendChild(el('span','sub',c.subtitle||''));
    h.appendChild(el('span','count',String(apps.length).padStart(2,'0')));h.appendChild(el('span','chev'));
    h.addEventListener('click',function(){var cl=s.classList.toggle('closed');h.setAttribute('aria-expanded',!cl);
      if(cl)collapsed[c.id]=1;else delete collapsed[c.id];lsSet(CK,JSON.stringify(collapsed))});
    s.appendChild(h);
    if(apps.length){var g=el('div','grid');apps.forEach(function(a){g.appendChild(card(a))});s.appendChild(g)}
    else s.appendChild(el('p','empty','New apps are on the way.'));
    main.appendChild(s)});
  if(term&&!found)main.appendChild(el('p','msg','No apps match “'+q.value.trim()+'”.'));
}
q.addEventListener('input',render);
function head(s){
  s=s||{};var name=s.name||'Graviton Apps';
  document.getElementById('siteName').textContent=name;document.title=name;
  document.getElementById('siteTag').textContent=s.tagline||'';
  var m=document.querySelector('meta[name=description]');if(m)m.content=s.tagline||name;
  var hb=document.getElementById('hbtns');hb.textContent='';
  var y=safeUrl(s.youtube);if(y){var a=el('a','pill','Watch on YouTube ↗');a.href=y;a.target='_blank';a.rel='noopener';hb.appendChild(a)}
}
fetch('apps.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){DATA=d;head(d.settings);render()})
.catch(function(){main.textContent='';main.appendChild(el('p','msg','Could not load the app list. Please refresh the page.'))});
})();
</script>
</body>
</html>
